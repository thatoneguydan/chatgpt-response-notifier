name: Verify and apply live notifier v0.9.36

on:
  push:
    branches: [ops/verify-apply-live-v0.9.36]
    paths:
      - .github/workflows/verify-apply-live-v0.9.36.yml

permissions:
  contents: read

jobs:
  verify-apply:
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    steps:
      - name: Verify interactive helper and apply managed update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = '0.9.36'
          $expectedSource = 'e96aae20b49db910abe830e477e37d73aa785db9'
          $port = 38473

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NotifierSessionNative
          {
              [DllImport("kernel32.dll")]
              public static extern uint WTSGetActiveConsoleSessionId();
          }
          '@

          function Get-ActiveConsoleSession {
            $session = [NotifierSessionNative]::WTSGetActiveConsoleSessionId()
            if ($session -eq [uint32]::MaxValue) { throw 'Windows reports no active console session.' }
            return [int]$session
          }

          function Get-BridgeOwner {
            $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $listener) { return $null }
            $process = Get-Process -Id $listener.OwningProcess -ErrorAction SilentlyContinue
            if (-not $process) { return $null }
            return [pscustomobject]@{
              Pid = [int]$process.Id
              SessionId = [int]$process.SessionId
            }
          }

          function Invoke-BridgeMessage([hashtable]$Message, [int]$TimeoutSeconds = 20) {
            $uri = [Uri]"ws://127.0.0.1:$port/bridge"
            $socket = [System.Net.WebSockets.ClientWebSocket]::new()
            $socket.Options.SetRequestHeader('Origin', 'chrome-extension://lciedmoiiapbgemklkpoadimhffaaaah')
            $cts = [System.Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($TimeoutSeconds))
            try {
              $socket.ConnectAsync($uri, $cts.Token).GetAwaiter().GetResult()
              $json = $Message | ConvertTo-Json -Compress
              $bytes = [Text.Encoding]::UTF8.GetBytes($json)
              $segment = [ArraySegment[byte]]::new($bytes)
              $socket.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $cts.Token).GetAwaiter().GetResult()

              $buffer = New-Object byte[] 65536
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                $memory = [ArraySegment[byte]]::new($buffer)
                $result = $socket.ReceiveAsync($memory, $cts.Token).GetAwaiter().GetResult()
                if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) { break }
                $text = [Text.Encoding]::UTF8.GetString($buffer, 0, $result.Count)
                $event = $text | ConvertFrom-Json
                if ([string]$event.requestId -eq [string]$Message.requestId) { return $event }
              }
              return $null
            } finally {
              try { $socket.Dispose() } catch {}
              $cts.Dispose()
            }
          }

          function Ping-Bridge([int]$TimeoutSeconds = 20) {
            $requestId = [Guid]::NewGuid().ToString('N')
            return Invoke-BridgeMessage @{ type = 'ping'; requestId = $requestId } $TimeoutSeconds
          }

          $activeSession = Get-ActiveConsoleSession
          $beforeOwner = Get-BridgeOwner
          if (-not $beforeOwner) { throw 'No notifier helper is listening on the production localhost bridge.' }

          $interactiveOwner = $beforeOwner.SessionId -eq $activeSession
          $beforePong = if ($interactiveOwner) { Ping-Bridge 20 } else { $null }
          Write-Host ("PRECHECK " + (@{
            bridgeListening = $true
            bridgeOwnerInteractive = $interactiveOwner
            bridgeOwnerSession = $beforeOwner.SessionId
            activeConsoleSession = $activeSession
            reportedVersion = [string]$beforePong.installedExtensionVersion
            sourceMatchesExpected = ([string]$beforePong.installedSourceCommit -eq $expectedSource)
          } | ConvertTo-Json -Compress))

          if (-not $interactiveOwner) {
            throw 'Production notifier bridge is owned by a non-interactive session; refusing to update the wrong helper.'
          }
          if (-not $beforePong) { throw 'Interactive notifier helper did not answer the pre-update verification ping.' }

          $alreadyCurrent = (
            [string]$beforePong.installedExtensionVersion -eq $expectedVersion -and
            [string]$beforePong.installedSourceCommit -eq $expectedSource
          )

          if (-not $alreadyCurrent) {
            $requestId = [Guid]::NewGuid().ToString('N')
            try {
              $result = Invoke-BridgeMessage @{ type = 'update.check'; requestId = $requestId } 180
              Write-Host ("UPDATE_RESULT " + (@{
                received = ($null -ne $result)
                state = [string]$result.updateStatus.state
                currentVersion = [string]$result.updateStatus.currentVersion
                availableVersion = [string]$result.updateStatus.availableVersion
                errorPresent = -not [string]::IsNullOrWhiteSpace([string]$result.updateStatus.error)
              } | ConvertTo-Json -Compress))
            } catch {
              # A successful managed update deliberately replaces the helper,
              # which may close this WebSocket before update.result is observed.
              Write-Host 'UPDATE_RESULT connection-replaced-during-update'
            }
          }

          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          $verifiedPong = $null
          do {
            Start-Sleep -Seconds 2
            $owner = Get-BridgeOwner
            if (-not $owner -or $owner.SessionId -ne $activeSession) { continue }
            try { $pong = Ping-Bridge 10 } catch { $pong = $null }
            if (
              $pong -and
              [string]$pong.installedExtensionVersion -eq $expectedVersion -and
              [string]$pong.installedSourceCommit -eq $expectedSource
            ) {
              $verifiedPong = $pong
              break
            }
          } while ([DateTime]::UtcNow -lt $deadline)

          if (-not $verifiedPong) {
            throw 'Live interactive notifier did not report the expected v0.9.36 version and source after managed update.'
          }

          Write-Host ("VERIFIED " + (@{
            version = [string]$verifiedPong.installedExtensionVersion
            sourceMatchesExpected = ([string]$verifiedPong.installedSourceCommit -eq $expectedSource)
            bridgeOwnerInteractive = $true
            managedUpdateApplied = (-not $alreadyCurrent)
            alreadyCurrent = $alreadyCurrent
          } | ConvertTo-Json -Compress))
