name: Cancel superseded PR runs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose superseded runs should be cancelled
        required: true
        type: number
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  cancel:
    if: >-
      (github.actor == github.repository_owner) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '/cancel-superseded-runs'
        )
      )
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 5

    steps:
      - name: Cancel queued or running runs from older PR heads
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs?.pr_number)
              : Number(context.issue.number);

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${prNumber}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const currentHead = pr.head.sha;
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'requested',
              'pending',
            ]);

            const runs = [];
            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }

            const superseded = runs.filter((run) => {
              if (!activeStatuses.has(run.status)) return false;
              if (run.head_sha === currentHead) return false;
              if (run.id === context.runId) return false;
              return (run.pull_requests || []).some((linkedPr) => linkedPr.number === prNumber);
            });

            const cancelled = [];
            const alreadySettled = [];
            for (const run of superseded) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                cancelled.push({
                  id: run.id,
                  name: run.name,
                  head: run.head_sha,
                  status: run.status,
                });
              } catch (error) {
                if (error.status === 409) {
                  alreadySettled.push(run.id);
                  continue;
                }
                throw error;
              }
            }

            core.notice(
              `PR #${prNumber}: current head ${currentHead}; cancelled ${cancelled.length} superseded run(s); ${alreadySettled.length} settled before cancellation.`
            );
            core.setOutput('current_head', currentHead);
            core.setOutput('cancelled_count', String(cancelled.length));
            core.setOutput('cancelled_runs', JSON.stringify(cancelled));
