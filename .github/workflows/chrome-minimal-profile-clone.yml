name: Collect minimal Chrome profile clone evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ChatGPTResponseNotifier.Host/ChromeMinimalProfileCloneProbePublisher.cs'
      - 'tools/Add-NotifierChromeMinimalProfileCloneEvidence.ps1'
      - '.github/workflows/chrome-minimal-profile-clone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 4
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }

      - name: Validate adapter syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\Add-NotifierChromeMinimalProfileCloneEvidence.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Minimal Chrome profile clone adapter has PowerShell parse errors.'
          }

      - name: Collect bounded helper evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chrome-minimal-profile-clone-evidence.json'
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:SOURCE_SHA
            readOnlySource = $true
            chrome = [ordered]@{}
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $output -Encoding UTF8

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Add-NotifierChromeMinimalProfileCloneEvidence.ps1 -EvidencePath $output
          if ($LASTEXITCODE -ne 0) { throw "Minimal Chrome profile clone adapter failed with exit code $LASTEXITCODE." }

          $evidence = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          if ($evidence.schemaVersion -ne 1 -or $evidence.readOnlySource -ne $true) {
            throw 'Minimal Chrome profile clone evidence schema/read-only marker is invalid.'
          }
          if ([string]$evidence.sourceCommit -ne $env:SOURCE_SHA) {
            throw 'Minimal Chrome profile clone evidence source mismatch.'
          }
          foreach ($forbidden in @('C:\Users\dan','responseBody','responseText','conversationUrl','cookie','history','sessionToken','accessToken')) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Minimal Chrome profile clone evidence leaked forbidden detail: $forbidden"
            }
          }
          if ($evidence.chrome.minimalProfileClone.sourceProfileMutated -eq $true) {
            throw 'Minimal Chrome profile clone probe reported a real-profile mutation.'
          }
          if ([int]$evidence.chrome.minimalProfileClone.copiedBrowsingDatabases -ne 0) {
            throw 'Minimal Chrome profile clone probe copied a browsing database.'
          }
          if ($evidence.chrome.minimalProfileClone.chatGptNavigationPerformed -eq $true) {
            throw 'Minimal Chrome profile clone probe navigated to ChatGPT.'
          }

          Write-Host ("Minimal clone summary: state={0}; chrome={1}; registeredBefore={2}; loadedBefore={3}; enabledBefore={4}; repairAttempted={5}; repairSucceeded={6}; loadedAfter={7}; registeredAfter={8}; tempDeleted={9}" -f `
            $evidence.chrome.minimalProfileClone.state,
            $evidence.chrome.minimalProfileClone.chromeVersion,
            $evidence.chrome.minimalProfileClone.cloneRegistrationPresentBefore,
            $evidence.chrome.minimalProfileClone.notifierListedBeforeRepair,
            $evidence.chrome.minimalProfileClone.notifierEnabledBeforeRepair,
            $evidence.chrome.minimalProfileClone.repairLoadAttempted,
            $evidence.chrome.minimalProfileClone.repairLoadSucceeded,
            $evidence.chrome.minimalProfileClone.notifierListedAfterRepair,
            $evidence.chrome.minimalProfileClone.cloneRegistrationPresentAfter,
            $evidence.chrome.minimalProfileClone.temporaryCloneDeleted)

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: chrome-minimal-profile-clone-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chrome-minimal-profile-clone-evidence.json
          if-no-files-found: error
          retention-days: 7
