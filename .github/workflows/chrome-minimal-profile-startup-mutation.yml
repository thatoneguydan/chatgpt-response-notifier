name: Collect Chrome clone startup-mutation evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ChatGPTResponseNotifier.Host/ChromeMinimalProfileStartupMutationProbePublisher.cs'
      - 'tools/Add-NotifierChromeMinimalProfileStartupMutationEvidence.ps1'
      - '.github/workflows/chrome-minimal-profile-startup-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 4
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }

      - name: Validate adapter syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\Add-NotifierChromeMinimalProfileStartupMutationEvidence.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Chrome clone startup-mutation adapter has PowerShell parse errors.'
          }

      - name: Collect bounded helper evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chrome-minimal-profile-startup-mutation-evidence.json'
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:SOURCE_SHA
            readOnlySource = $true
            chrome = [ordered]@{}
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $output -Encoding UTF8

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Add-NotifierChromeMinimalProfileStartupMutationEvidence.ps1 -EvidencePath $output
          if ($LASTEXITCODE -ne 0) { throw "Chrome clone startup-mutation adapter failed with exit code $LASTEXITCODE." }

          $evidence = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          if ($evidence.schemaVersion -ne 1 -or $evidence.readOnlySource -ne $true) {
            throw 'Chrome clone startup-mutation evidence schema/read-only marker is invalid.'
          }
          if ([string]$evidence.sourceCommit -ne $env:SOURCE_SHA) {
            throw 'Chrome clone startup-mutation evidence source mismatch.'
          }
          foreach ($forbidden in @('C:\Users\dan','responseBody','responseText','conversationUrl','cookie','history','sessionToken','accessToken')) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Chrome clone startup-mutation evidence leaked forbidden detail: $forbidden"
            }
          }
          $probe = $evidence.chrome.minimalProfileStartupMutation
          if ($probe.sourceProfileMutated -eq $true) { throw 'Startup-mutation probe reported a real-profile mutation.' }
          if ([int]$probe.copiedBrowsingDatabases -ne 0) { throw 'Startup-mutation probe copied a browsing database.' }
          if ($probe.chatGptNavigationPerformed -eq $true) { throw 'Startup-mutation probe navigated to ChatGPT.' }
          if ($probe.repairAttempted -eq $true) { throw 'Startup-mutation probe attempted an extension repair.' }
          if ($probe.state -in @('complete','probe-error') -and $probe.temporaryCloneDeleted -ne $true) {
            throw 'Startup-mutation probe did not verify deletion of its temporary clone.'
          }

          Write-Host ("Startup-only clone summary: state={0}; chrome={1}; registeredBefore={2}; listed={3}; registeredAfter={4}; legacyAfter={5}; encryptedAfter={6}; unpackedBefore={7}; unpackedAfter={8}; tempDeleted={9}; error={10}" -f `
            $probe.state,
            $probe.chromeVersion,
            $probe.cloneRegistrationPresentBefore,
            $probe.notifierListedByChrome,
            $probe.cloneRegistrationPresentAfterStartup,
            $probe.cloneLegacyAuthenticatorPresentAfterStartup,
            $probe.cloneEncryptedAuthenticatorPresentAfterStartup,
            $probe.rawUnpackedRegistrationCountBefore,
            $probe.rawUnpackedRegistrationCountAfterStartup,
            $probe.temporaryCloneDeleted,
            $probe.errorCode)

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: chrome-minimal-profile-startup-mutation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chrome-minimal-profile-startup-mutation-evidence.json
          if-no-files-found: error
          retention-days: 7
