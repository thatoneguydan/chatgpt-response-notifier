name: Compare unpacked Chrome extension registrations

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ChatGPTResponseNotifier.Host/ChromeUnpackedControlComparisonEvidencePublisher.cs'
      - 'tools/Collect-ChromeUnpackedControlComparison.ps1'
      - '.github/workflows/chrome-unpacked-control-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 4
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }

      - name: Validate probe syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\Collect-ChromeUnpackedControlComparison.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Unpacked control comparison probe has PowerShell parse errors.'
          }

      - name: Collect bounded control comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chrome-unpacked-control-comparison.json'

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Collect-ChromeUnpackedControlComparison.ps1 -OutputPath $output
          if ($LASTEXITCODE -ne 0) {
            throw "Unpacked control comparison probe failed with exit code $LASTEXITCODE."
          }

          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          $evidence = $raw | ConvertFrom-Json -ErrorAction Stop
          if ([int]$evidence.schemaVersion -ne 1) { throw 'Unexpected comparison evidence schema.' }
          if ([string]$evidence.capability -cne 'chrome-unpacked-control-comparison-readonly-v1') { throw 'Unexpected comparison evidence capability.' }
          if ($evidence.readOnly -ne $true) { throw 'Comparison evidence is not marked read-only.' }

          $preDeployment = [string]$evidence.state -ceq 'helper-snapshot-unavailable'
          if (-not $preDeployment -and [string]::IsNullOrWhiteSpace([string]$evidence.targetExtensionId)) {
            throw 'Target extension ID was not resolved by the deployed helper.'
          }

          foreach ($forbidden in @(
            'C:\Users\dan',
            'responseBody',
            'responseText',
            'conversationUrl',
            'history',
            'cookies',
            'password',
            'oauth',
            'privateKey'
          )) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Control comparison evidence leaked forbidden detail: $forbidden"
            }
          }

          foreach ($record in @($evidence.records)) {
            foreach ($propertyName in @('path','rawPath','preferencePath','profilePath')) {
              if ($null -ne $record.PSObject.Properties[$propertyName]) {
                throw "Control comparison evidence contains forbidden raw path property: $propertyName"
              }
            }
          }

          Write-Host ("Unpacked comparison: state={0}; target={1}; targetRegs={2}; controlCandidates={3}; profiles={4}; inspected={5}; unavailable={6}; preDeployment={7}" -f `
            $evidence.state,
            $evidence.targetExtensionId,
            $evidence.targetRegistrationCount,
            $evidence.controlCandidateCount,
            $evidence.profilesDiscovered,
            $evidence.profileFilesInspected,
            $evidence.profileFilesUnavailable,
            $preDeployment)

          foreach ($record in @($evidence.records)) {
            Write-Host ("  role={0}; id={1}; profile={2}; source={3}; state={4}; location={5}; disabled={6}; category={7}; exists={8}; manifest={9}; key={10}; idMatch={11}; version={12}; name={13}" -f `
              $record.role,
              $record.extensionId,
              $record.profile,
              $record.source,
              $record.stateValue,
              $record.locationValue,
              $record.disableReasonCount,
              $record.pathCategory,
              $record.pathExists,
              $record.manifestReadable,
              $record.manifestKeyPresent,
              $record.calculatedIdMatchesRegistration,
              $record.manifestVersion,
              $record.manifestName)
          }

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: chrome-unpacked-control-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chrome-unpacked-control-comparison.json
          if-no-files-found: error
          retention-days: 7
