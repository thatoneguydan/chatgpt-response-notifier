name: Build and publish Quick Continue release

on:
  push:
    branches: [main]
    paths:
      - 'standalone-quick-continue/**'
      - '.github/workflows/quick-continue-release.yml'
      - '!standalone-quick-continue/update/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-extension-release-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Quick Continue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            '.\standalone-quick-continue\dom-compat.js',
            '.\standalone-quick-continue\background.js',
            '.\standalone-quick-continue\prompt-format.js',
            '.\standalone-quick-continue\config.js',
            '.\standalone-quick-continue\composer-text.js',
            '.\standalone-quick-continue\send-transaction.js',
            '.\standalone-quick-continue\runtime-reset.js',
            '.\standalone-quick-continue\content-script.js',
            '.\standalone-quick-continue\hover-edit-script.js',
            '.\standalone-quick-continue\conversation-state.js'
          )) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "Quick Continue syntax validation failed: $script" }
          }
          node --test .\tests\standalone-quick-continue.behavior.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Quick Continue behavior tests failed.' }

      - name: Build release and publish update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = '.\standalone-quick-continue\manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Quick Continue manifest version is empty.' }
          $tag = "quick-continue-v$version"
          $assetName = "ChatGPT-Quick-Continue-$version.zip"
          $artifactRoot = Join-Path $env:RUNNER_TEMP ("chatgpt-quick-continue-release-$version")
          Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $zip = Join-Path $artifactRoot $assetName

          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch existing Quick Continue release tag.' }
            $sourceCommit = (git rev-list -n 1 $tag).Trim()
            if ([string]::IsNullOrWhiteSpace($sourceCommit)) { throw 'Could not resolve existing Quick Continue release source commit.' }
            gh release download $tag --pattern $assetName --dir $artifactRoot --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not download existing Quick Continue release asset.' }
          }
          else {
            $sourceCommit = $env:GITHUB_SHA
            $stage = Join-Path $artifactRoot 'stage'
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            $runtimeFiles = @(
              'manifest.json',
              'dom-compat.js',
              'background.js',
              'prompt-format.js',
              'config.js',
              'config.json',
              'composer-text.js',
              'send-transaction.js',
              'runtime-reset.js',
              'content-script.js',
              'hover-edit-script.js',
              'conversation-state.js',
              'README.md'
            )
            foreach ($name in $runtimeFiles) {
              $source = Join-Path '.\standalone-quick-continue' $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Quick Continue release file missing: $name" }
              Copy-Item -LiteralPath $source -Destination (Join-Path $stage $name) -Force
            }
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
            gh release create $tag $zip --target $sourceCommit --title "ChatGPT Quick Continue $version" --notes "Managed ChatGPT Quick Continue release $version."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Quick Continue release.' }
          }

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Quick Continue release ZIP is missing.' }
          $sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/thatoneguydan/chatgpt-response-notifier/releases/download/$tag/$assetName"
          $feedTemp = Join-Path $artifactRoot 'update-manifest.json'
          [ordered]@{
            schemaVersion = 1
            version = $version
            sourceCommit = $sourceCommit
            downloadUrl = $downloadUrl
            sha256 = $sha256
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $feedTemp -Encoding UTF8

          # Release jobs may start from an older main commit if another release feed
          # was published while they were queued. Always publish onto the latest main.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh main before publishing the Quick Continue update feed.' }
          git checkout -B publish-quick-continue-feed origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not base the Quick Continue update feed on current main.' }
          $updateDirectory = '.\standalone-quick-continue\update'
          New-Item -ItemType Directory -Path $updateDirectory -Force | Out-Null
          Copy-Item -LiteralPath $feedTemp -Destination (Join-Path $updateDirectory 'manifest.json') -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone-quick-continue/update/manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Quick Continue update manifest for $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the Quick Continue update feed.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the Quick Continue update feed.' }
          }

      - name: Install and verify released Quick Continue on Glass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $feedPath = '.\standalone-quick-continue\update\manifest.json'
          $feed = Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json
          $expectedVersion = [string]$feed.version
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw 'Published Quick Continue update feed has no version.'
          }

          # The helper reads the raw.githubusercontent.com feed. A just-pushed main
          # commit can reach the Git API before the raw edge cache exposes it, so do
          # not ask Glass to update until the exact public feed it consumes is current.
          $publicFeedBase = 'https://raw.githubusercontent.com/thatoneguydan/chatgpt-response-notifier/main/standalone-quick-continue/update/manifest.json'
          $publicFeedVisible = $false
          $lastPublicVersion = $null
          $lastPublicFailure = $null
          for ($attempt = 1; $attempt -le 24; $attempt += 1) {
            try {
              $cacheBust = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $publicFeed = Invoke-RestMethod -Uri "${publicFeedBase}?cacheBust=$cacheBust" -Headers @{ 'Cache-Control' = 'no-cache'; 'Pragma' = 'no-cache' } -TimeoutSec 30
              $lastPublicVersion = [string]$publicFeed.version
              Write-Host "Quick Continue public-feed propagation attempt $attempt`: expected=$expectedVersion visible=$lastPublicVersion"
              if ($lastPublicVersion -eq $expectedVersion) {
                $publicFeedVisible = $true
                break
              }
              $lastPublicFailure = "public feed still reports version=$lastPublicVersion"
            }
            catch {
              $lastPublicFailure = $_.Exception.Message
              Write-Warning "Quick Continue public-feed propagation attempt $attempt failed: $lastPublicFailure"
            }

            if ($attempt -lt 24) { Start-Sleep -Seconds 5 }
          }

          if (-not $publicFeedVisible) {
            throw "Quick Continue $expectedVersion was published to main but did not propagate to the public raw feed. Last result: $lastPublicFailure"
          }

          $endpoint = 'http://127.0.0.1:38473/quick-continue/update'
          $lastResponse = $null
          $lastFailure = $null
          $verified = $false

          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            try {
              $lastResponse = Invoke-RestMethod -Uri $endpoint -Method Get -TimeoutSec 300
              $installedVersion = [string]$lastResponse.installedVersion
              $state = [string]$lastResponse.updateStatus.state
              $availableVersion = [string]$lastResponse.updateStatus.availableVersion
              $updateError = [string]$lastResponse.updateStatus.error
              Write-Host "Quick Continue deployment acceptance attempt $attempt`: expected=$expectedVersion installed=$installedVersion state=$state available=$availableVersion error=$updateError"
              if ($installedVersion -eq $expectedVersion) {
                $verified = $true
                break
              }
              $lastFailure = "helper returned installedVersion=$installedVersion state=$state availableVersion=$availableVersion error=$updateError"
            }
            catch {
              $lastFailure = $_.Exception.Message
              Write-Warning "Quick Continue deployment acceptance attempt $attempt failed: $lastFailure"
            }

            if ($attempt -lt 6) { Start-Sleep -Seconds 5 }
          }

          if (-not $verified) {
            throw "Quick Continue $expectedVersion was published but Glass did not verify that version through the local helper. Last result: $lastFailure"
          }

          Write-Host "Quick Continue $expectedVersion is installed on Glass and confirmed by the local helper."
