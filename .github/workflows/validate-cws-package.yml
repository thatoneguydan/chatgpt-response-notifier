name: Validate Chrome Web Store package

on:
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'tools/Build-ChromeWebStorePackage.ps1'
      - 'tools/Build-ChromeWebStoreFirstUploadPackage.ps1'
      - '.github/workflows/validate-cws-package.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cws-package:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity and key hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual." }
          $trackedPem = @(git ls-files '*.pem')
          if ($trackedPem.Count -gt 0) { throw 'A private-key PEM file is tracked by Git.' }
          if (-not (Select-String -LiteralPath '.gitignore' -Pattern '^\*\.pem$' -Quiet)) {
            throw 'Repository no longer ignores PEM private-key files.'
          }

      - name: Validate package builders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            '.\tools\Build-ChromeWebStorePackage.ps1',
            '.\tools\Build-ChromeWebStoreFirstUploadPackage.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse errors in $script"
            }
          }

      - name: Build and inspect ordinary Web Store package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:RUNNER_TEMP 'chatgpt-response-notifier-cws.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'chatgpt-response-notifier-cws-expanded'
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction SilentlyContinue

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Build-ChromeWebStorePackage.ps1 -OutputPath $zipPath
          if ($LASTEXITCODE -ne 0) { throw "Chrome Web Store package builder failed with exit code $LASTEXITCODE." }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $expanded -Force

          $sourceManifest = Get-Content -LiteralPath .\extension\manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $storeManifest = Get-Content -LiteralPath (Join-Path $expanded 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($null -eq $sourceManifest.PSObject.Properties['key']) { throw 'Development manifest unexpectedly lacks its stable identity key.' }
          if ($null -ne $storeManifest.PSObject.Properties['key']) { throw 'Web Store manifest still contains the development-only key.' }
          if ([string]$storeManifest.version -cne [string]$sourceManifest.version) { throw 'Web Store package changed the extension version.' }
          if (@(Get-ChildItem -LiteralPath $expanded -File -Recurse -Filter '*.pem').Count -gt 0) { throw 'Ordinary Web Store package contains a PEM file.' }

          $requiredIcons = [ordered]@{
            '16' = 'icons/icon16.png'
            '32' = 'icons/icon32.png'
            '48' = 'icons/icon48.png'
            '128' = 'icons/icon128.png'
          }
          foreach ($entry in $requiredIcons.GetEnumerator()) {
            $manifestPath = [string]$storeManifest.icons.($entry.Key)
            if ($manifestPath -cne $entry.Value) { throw "Manifest icon $($entry.Key) does not reference $($entry.Value)." }
            $iconPath = Join-Path $expanded $entry.Value
            if (-not (Test-Path -LiteralPath $iconPath -PathType Leaf)) { throw "Package is missing $($entry.Value)." }
            $image = [System.Drawing.Image]::FromFile($iconPath)
            try {
              $size = [int]$entry.Key
              if ($image.Width -ne $size -or $image.Height -ne $size) {
                throw "$($entry.Value) is $($image.Width)x$($image.Height), expected ${size}x${size}."
              }
            }
            finally { $image.Dispose() }
          }

          $sourceFiles = @(Get-ChildItem -LiteralPath .\extension -File -Recurse | Where-Object { $_.Name -cne 'manifest.json' })
          $storeFiles = @(Get-ChildItem -LiteralPath $expanded -File -Recurse | Where-Object { $_.Name -cne 'manifest.json' })
          if ($sourceFiles.Count -ne $storeFiles.Count) { throw 'Web Store package file count differs from extension source.' }
          foreach ($sourceFile in $sourceFiles) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path '.\extension').Path, $sourceFile.FullName)
            $storeFile = Join-Path $expanded $relative
            if (-not (Test-Path -LiteralPath $storeFile -PathType Leaf)) { throw "Web Store package is missing $relative." }
            $sourceHash = (Get-FileHash -LiteralPath $sourceFile.FullName -Algorithm SHA256).Hash
            $storeHash = (Get-FileHash -LiteralPath $storeFile -Algorithm SHA256).Hash
            if ($sourceHash -cne $storeHash) { throw "Web Store package changed $relative." }
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Validated ordinary Web Store package: files=$($storeFiles.Count + 1); version=$($storeManifest.version); sha256=$hash"

      - name: Upload safe unsigned Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-response-notifier-cws-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chatgpt-response-notifier-cws.zip
          if-no-files-found: error
          retention-days: 7
