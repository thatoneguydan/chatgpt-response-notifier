name: Install Quick Continue v1.2.3 on Glass

on:
  push:
    branches: [ops/install-quick-continue-v1.2.3]
    paths:
      - .github/workflows/install-quick-continue-v1.2.3.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install exact Quick Continue files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'standalone-quick-continue'
          $target = 'C:\Users\dan\AppData\Local\ChatGPTQuickContinue\Extension'
          if (-not (Test-Path -LiteralPath $target)) { throw "Quick Continue install path not found: $target" }

          $before = Get-Content -LiteralPath (Join-Path $target 'manifest.json') -Raw | ConvertFrom-Json
          Write-Host ("PRECHECK " + (@{ version=[string]$before.version; targetExists=$true } | ConvertTo-Json -Compress))

          $files = @('manifest.json','content-script.js','prompt-format.js','config.js','config.json')
          foreach ($name in $files) {
            $src = Join-Path $source $name
            $dst = Join-Path $target $name
            if (-not (Test-Path -LiteralPath $src)) { throw "Missing source file: $name" }
            Copy-Item -LiteralPath $src -Destination $dst -Force
            $srcHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $src).Hash
            $dstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dst).Hash
            if ($srcHash -ne $dstHash) { throw "Hash mismatch after copy: $name" }
          }

          $after = Get-Content -LiteralPath (Join-Path $target 'manifest.json') -Raw | ConvertFrom-Json
          if ([string]$after.version -ne '1.2.3') { throw "Expected Quick Continue 1.2.3, found $($after.version)" }
          Write-Host ("VERIFIED " + (@{ version=[string]$after.version; filesVerified=$files.Count } | ConvertTo-Json -Compress))
