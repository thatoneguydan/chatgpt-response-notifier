name: Validate notifier source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Dan's workstation runner may execute only trusted same-repository source.
    # Fork PRs remain visible but never receive a self-hosted job assignment.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder, glass-chatgpt-response-notifier]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate extension architecture and source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            '.\extension\background.js',
            '.\extension\attachment-script.js',
            '.\extension\coordinator-background.js',
            '.\extension\service-worker.js',
            '.\extension\content-script.js',
            '.\extension\persistence-script.js',
            '.\extension\status-code.js',
            '.\extension\status-policy.js',
            '.\extension\status-script.js',
            '.\extension\recovery-background.js',
            '.\extension\recovery-script.js',
            '.\extension\history-background.js',
            '.\extension\monitor-background.js',
            '.\extension\monitor-script.js',
            '.\extension\recovery-model.js',
            '.\extension\monitor-query-compat-background.js',
            '.\extension\recovery-control-background.js',
            '.\extension\bounded-recovery-background.js',
            '.\extension\bounded-recovery-attachment-background.js',
            '.\extension\bounded-recovery-script.js',
            '.\extension\normal-continuation-budget-hook.js',
            '.\extension\popup.js'
          )) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax validation failed: $script" }
          }

          node --test `
            .\tests\extension\architecture.test.mjs `
            .\tests\extension\coordinator.behavior.test.mjs `
            .\tests\extension\status-policy.behavior.test.mjs `
            .\tests\extension\bounded-recovery.behavior.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension architecture/behavior tests failed.' }

          $manifest = Get-Content -LiteralPath .\extension\manifest.json -Raw | ConvertFrom-Json
          foreach ($forbidden in @('downloads', 'storage', 'nativeMessaging', 'notifications', 'offscreen')) {
            if ($manifest.permissions -contains $forbidden) { throw "Forbidden extension permission present: $forbidden" }
          }
          if ($manifest.permissions -notcontains 'alarms') { throw 'Bounded recovery requires the reviewed alarms permission.' }
          if ($manifest.host_permissions -contains 'https://github.com/*') { throw 'Extension must not depend on GitHub browser permissions.' }
          if ($manifest.host_permissions -notcontains 'ws://127.0.0.1/*') { throw 'Loopback WebSocket permission is missing.' }

      - name: Build Windows helper and Setup project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\src\ChatGPTResponseNotifier.Host\ChatGPTResponseNotifier.Host.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper build failed.' }
          dotnet build .\installer\ChatGPTResponseNotifier.Setup.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Setup.exe project build failed.' }
