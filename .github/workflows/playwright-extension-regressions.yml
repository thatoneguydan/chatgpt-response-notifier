name: Playwright extension regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regressions:
    # Glass may execute only trusted same-repository source.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify affected-validation routing fixtures
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        run: |
          node --test .github/scripts/validation-reuse.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'VALIDATION_ROUTING_FIXTURES_FAILED' }

      - name: Install pinned Playwright test dependency
        id: validation_proof_0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location .\tests\playwright
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed.' }
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Playwright Chromium install failed.' }
          }
          finally {
            Pop-Location
          }


      - name: Plan affected source validation
        id: validation_plan
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/validation-reuse.mjs playwright-extension-regressions-browser-regressions
          if ($LASTEXITCODE -ne 0) { throw 'VALIDATION_PLAN_FAILED' }

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }
          Write-Host "Exact source head: $actual"

      - name: Run traffic-inert MV3 browser regressions
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location .\tests\playwright
          try {
            npm test
            if ($LASTEXITCODE -ne 0) { throw 'Playwright extension regressions failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-extension-regression-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: ${{ steps.validation_plan.outputs.receipt }}
        if: ${{ success() && steps.validation_plan.outputs.execute == 'true' && steps.validation_proof_0.outcome == 'success' && steps.validation_proof_1.outcome == 'success' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        run: Write-Host 'Complete source checks executed; this receipt grants no package or live authority.'

