name: Build and publish notifier release

on:
  push:
    branches: [main]
    paths-ignore:
      - update/manifest.json
      - standalone-quick-continue/**
      - tests/**
      - tools/quick-continue-*
      - .github/workflows/quick-continue-*.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-extension-release-publish
  cancel-in-progress: false

jobs:
  release:
    # Release source is trusted same-repository main/workflow_dispatch code and
    # runs only on the repository-scoped Glass runner. There is no hosted fallback.
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            '.\extension\background.js',
            '.\extension\diagnostics-bootstrap.js',
            '.\extension\cross-desktop-click-fallback-background.js',
            '.\extension\attachment-script.js',
            '.\extension\coordinator-background.js',
            '.\extension\service-worker.js',
            '.\extension\content-script.js',
            '.\extension\quick-prompts-script.js',
            '.\extension\persistence-script.js',
            '.\extension\status-code.js',
            '.\extension\status-policy.js',
            '.\extension\status-script.js',
            '.\extension\recovery-background.js',
            '.\extension\recovery-script.js',
            '.\extension\history-background.js',
            '.\extension\monitor-background.js',
            '.\extension\monitor-script.js',
            '.\extension\recovery-model.js',
            '.\extension\monitor-query-compat-background.js',
            '.\extension\recovery-control-background.js',
            '.\extension\recovery-live-fix-background.js',
            '.\extension\recovery-live-fix-content.js',
            '.\extension\bounded-recovery-background.js',
            '.\extension\bounded-recovery-attachment-background.js',
            '.\extension\quick-prompts-attachment-background.js',
            '.\extension\bounded-recovery-script.js',
            '.\extension\normal-continuation-budget-hook.js',
            '.\extension\response-stream-status-main.js',
            '.\extension\response-stream-status-bridge.js',
            '.\extension\response-stream-status-background.js',
            '.\extension\hidden-window-diagnostics-main.js',
            '.\extension\hidden-window-diagnostics-page.js',
            '.\extension\hidden-window-diagnostics-background.js',
            '.\extension\popup.js'
          )) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax validation failed: $script" }
          }

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Invoke-ExtensionTestSuite.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Extension tests failed.' }

      - name: Build, prove, and publish release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Publish-ExtensionRelease.ps1 -Publish
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }

      - name: Install and verify released notifier on Glass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = (git rev-parse HEAD).Trim()
          $version = (Get-Content .\VERSION.txt -Raw).Trim()
          $feed = Get-Content .\update\manifest.json -Raw | ConvertFrom-Json
          if ([string]$feed.version -ne $version) {
            throw "Published notifier feed version mismatch: expected $version, got $($feed.version)."
          }
          $sourceEntry = @($feed.downloads.PSObject.Properties | ForEach-Object {
            $key = [string]$_.Name
            $value = $_.Value
            if ([string]$value.sourceCommit -eq $sourceCommit) {
              [pscustomobject]@{ Key = $key; Value = $value }
            }
          } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $sourceEntry) {
            throw "Published notifier feed does not contain a download for source commit $sourceCommit."
          }
          $expectedSha = ([string]$sourceEntry.Value.sha256).ToLowerInvariant()
          if ($expectedSha -notmatch '^[a-f0-9]{64}$') {
            throw "Published notifier feed SHA is invalid: $expectedSha"
          }

          $statusUri = 'http://127.0.0.1:38473/status'
          $updateUri = 'http://127.0.0.1:38473/notifier/update'
          $deadline = [DateTime]::UtcNow.AddMinutes(8)
          $lastStatus = $null
          while ([DateTime]::UtcNow -lt $deadline) {
            try {
              $updateResult = Invoke-RestMethod -Uri $updateUri -Method Get -TimeoutSec 120
              $lastStatus = Invoke-RestMethod -Uri $statusUri -Method Get -TimeoutSec 10
              if (
                [string]$lastStatus.installedExtensionVersion -eq $version -and
                [string]$lastStatus.runningHostVersion -eq $version -and
                [string]$lastStatus.installedSourceCommit -eq $sourceCommit -and
                [string]$lastStatus.installedPackageSha256 -eq $expectedSha
              ) {
                Write-Host "Installed notifier $version from $sourceCommit and verified running helper/package identity on Glass."
                exit 0
              }
              if ($updateResult -and [string]$updateResult.result -eq 'failed') {
                Write-Host "Managed updater reported a failed attempt; continuing bounded convergence polling."
              }
            }
            catch {
              Write-Host "Managed notifier status/update probe not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }

          $lastJson = if ($lastStatus) { $lastStatus | ConvertTo-Json -Compress -Depth 6 } else { '<no status response>' }
          throw "Released notifier $version did not converge to exact source $sourceCommit / SHA $expectedSha on Glass within the bounded acceptance window. Last status: $lastJson"
