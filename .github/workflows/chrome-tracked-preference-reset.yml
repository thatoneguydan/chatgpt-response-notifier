name: Collect Chrome tracked-preference reset evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ChatGPTResponseNotifier.Host/ChromeTrackedPreferenceResetEvidencePublisher.cs'
      - 'tools/Add-NotifierChromeTrackedPreferenceResetEvidence.ps1'
      - '.github/workflows/chrome-tracked-preference-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 4
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }

      - name: Validate adapter syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\Add-NotifierChromeTrackedPreferenceResetEvidence.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Chrome tracked-preference reset adapter has PowerShell parse errors.'
          }

      - name: Collect bounded helper evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chrome-tracked-preference-reset-evidence.json'
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:SOURCE_SHA
            readOnlySource = $true
            chrome = [ordered]@{}
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $output -Encoding UTF8

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Add-NotifierChromeTrackedPreferenceResetEvidence.ps1 -EvidencePath $output
          if ($LASTEXITCODE -ne 0) { throw "Chrome tracked-preference reset adapter failed with exit code $LASTEXITCODE." }

          $evidence = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          if ($evidence.schemaVersion -ne 1 -or $evidence.readOnlySource -ne $true) {
            throw 'Chrome tracked-preference reset evidence schema/read-only marker is invalid.'
          }
          if ([string]$evidence.sourceCommit -ne $env:SOURCE_SHA) {
            throw 'Chrome tracked-preference reset evidence source mismatch.'
          }
          foreach ($forbidden in @('C:\Users\dan','extensions.settings.','responseBody','responseText','conversationUrl','cookie','history','sessionToken','accessToken')) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Chrome tracked-preference reset evidence leaked forbidden detail: $forbidden"
            }
          }
          if ($evidence.chrome.trackedPreferenceReset.sourceProfileMutated -eq $true) {
            throw 'Chrome tracked-preference reset evidence reported a real-profile mutation.'
          }

          Write-Host ("Tracked-reset summary: state={0}; profile={1}; registered={2}; notifierReset={3}; settingsReset={4}; resetCount={5}; resetTime={6}" -f `
            $evidence.chrome.trackedPreferenceReset.state,
            $evidence.chrome.trackedPreferenceReset.lastUsedProfile,
            $evidence.chrome.trackedPreferenceReset.registrationPresent,
            $evidence.chrome.trackedPreferenceReset.notifierTrackedResetRecorded,
            $evidence.chrome.trackedPreferenceReset.extensionsSettingsResetRecorded,
            $evidence.chrome.trackedPreferenceReset.trackedResetEntryCount,
            $evidence.chrome.trackedPreferenceReset.preferenceResetTimePresent)

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: chrome-tracked-preference-reset-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chrome-tracked-preference-reset-evidence.json
          if-no-files-found: error
          retention-days: 7
