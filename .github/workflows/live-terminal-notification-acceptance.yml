name: Validate installed terminal and notification path

on:
  pull_request:
    branches: [main]
    paths:
      - 'extension/rendered-terminal-status.js'
      - 'extension/terminal-live-proof-background.js'
      - 'extension/persistence-script.js'
      - 'extension/delivery-reliability-background.js'
      - 'src/ChatGPTResponseNotifier.Host/NativeHostApplication.cs'
      - 'src/ChatGPTResponseNotifier.Host/ToastManager.cs'
      - 'tools/Add-NotifierSafeEvidence.ps1'
      - 'tools/Test-NotifierLiveTerminalNotificationAcceptance.ps1'
      - 'tests/extension/live-terminal-notification-acceptance.behavior.test.mjs'
      - '.github/workflows/live-terminal-notification-acceptance.yml'
      - 'VERSION.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-installed-profile-acceptance:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact acceptance head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity and acceptance script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }
          foreach ($script in @(
            '.\tools\Add-NotifierSafeEvidence.ps1',
            '.\tools\Test-NotifierLiveTerminalNotificationAcceptance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Live acceptance script has PowerShell parse errors: $script"
            }
          }
          Write-Host "Exact live-acceptance control head: $actual"

      - name: Collect sanitized installed-profile acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'notifier-live-terminal-notification-evidence.json'
          [ordered]@{
            schemaVersion = 2
            collector = 'chatgpt-response-notifier-live-terminal-notification-acceptance'
            observedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
            sourceCommit = $env:SOURCE_SHA
            readOnly = $true
            chrome = [ordered]@{
              loadedExtensionRuntimeIdentitySupported = $false
              extensionConnectionLive = $false
            }
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $output -Encoding UTF8

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Add-NotifierSafeEvidence.ps1 -EvidencePath $output
          if ($LASTEXITCODE -ne 0) {
            throw "Bounded installed-profile evidence adapter failed with exit code $LASTEXITCODE."
          }

          $evidence = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $runtimeCandidate = [string]$evidence.safeRuntimeEvidence.sourceCommit
          if ($runtimeCandidate -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Installed runtime candidate commit is invalid: '$runtimeCandidate'."
          }
          git cat-file -e "$runtimeCandidate^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime candidate commit is not present in repository history: $runtimeCandidate" }
          git merge-base --is-ancestor $runtimeCandidate $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime candidate $runtimeCandidate is not an ancestor of acceptance head $env:SOURCE_SHA." }

          # Acceptance-only commits may refine proof logic without forcing another
          # normal-profile install. Fail closed if anything runtime-delivered changed.
          $allowedControlPaths = @(
            '.github/workflows/live-terminal-notification-acceptance.yml',
            'tools/Test-NotifierLiveTerminalNotificationAcceptance.ps1',
            'tests/extension/live-terminal-notification-acceptance.behavior.test.mjs'
          )
          $changed = @(git diff --name-only $runtimeCandidate $env:SOURCE_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare installed candidate with acceptance head.' }
          $unexpected = @($changed | Where-Object { $_ -notin $allowedControlPaths })
          if ($unexpected.Count -gt 0) {
            throw "Installed candidate is stale because runtime-affecting paths changed after install: $($unexpected -join ', ')"
          }
          "RUNTIME_CANDIDATE_SHA=$runtimeCandidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $evidence.sourceCommit = $env:SOURCE_SHA
          $evidence | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath $output -Encoding UTF8
          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          foreach ($forbidden in @('responseBody','responseText','sessionTitle','promptText','conversationUrl','commandLine','"error":')) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Live acceptance evidence contains forbidden field/content marker: $forbidden"
            }
          }
          if ($raw -match [regex]::Escape('C:\Users\dan')) {
            throw 'Live acceptance evidence leaked the interactive profile path.'
          }

          Write-Host ("Live acceptance evidence: state={0}; installed={1}; candidate={2}; runtimeSource={3}; controlHead={4}; currentExtension={5}; bridgeLive={6}; diagnostics={7}; delivery={8}" -f `
            $evidence.safeRuntimeEvidence.state,
            $evidence.safeRuntimeEvidence.installedVersion,
            (Get-Content -LiteralPath '.\VERSION.txt' -Raw -Encoding UTF8).Trim(),
            $runtimeCandidate,
            $env:SOURCE_SHA,
            $evidence.safeRuntimeEvidence.currentExtensionVersion,
            $evidence.chrome.extensionConnectionLive,
            @($evidence.safeRuntimeEvidence.diagnostics).Count,
            @($evidence.safeRuntimeEvidence.deliveryDiagnostics).Count)

      - name: Prove terminal stop and native notification acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'notifier-live-terminal-notification-evidence.json'
          $version = (Get-Content -LiteralPath '.\VERSION.txt' -Raw -Encoding UTF8).Trim()
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Test-NotifierLiveTerminalNotificationAcceptance.ps1 `
            -EvidencePath $output `
            -ExpectedVersion $version `
            -ExpectedSourceCommit $env:RUNTIME_CANDIDATE_SHA `
            -MinimumLiveDefinitiveProofs 1
          if ($LASTEXITCODE -ne 0) {
            throw "Installed-profile terminal/notification acceptance failed with exit code $LASTEXITCODE."
          }

      - name: Upload sanitized live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifier-live-terminal-notification-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\notifier-live-terminal-notification-evidence.json
          if-no-files-found: warn
          retention-days: 7
