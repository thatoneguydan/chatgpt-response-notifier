name: Apply public notifier 0.2.20 source

on:
  push:
    branches:
      - fix/request-start-watch-0.2.20

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/request-start-watch-0.2.20

      - name: Apply and validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\apply-0.2.20.py
          if ($LASTEXITCODE -ne 0) { throw '0.2.20 patch failed.' }
          node --check .\extension\service-worker.js
          if ($LASTEXITCODE -ne 0) { throw 'service-worker syntax check failed.' }
          node --check .\extension\popup.js
          if ($LASTEXITCODE -ne 0) { throw 'popup syntax check failed.' }
          node --check .\extension\lib\server-capture.js
          if ($LASTEXITCODE -ne 0) { throw 'server-capture syntax check failed.' }

      - name: Commit public source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Patch produced no changes.' }
          git commit -m 'Watch ChatGPT responses from request start'
          git push origin HEAD:fix/request-start-watch-0.2.20
