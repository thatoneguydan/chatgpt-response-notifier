name: Collect interactive Chrome launch and user policy evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ChatGPTResponseNotifier.Host/ChromeInteractiveLaunchPolicyEvidencePublisher.cs'
      - 'tools/Add-NotifierChromeInteractiveLaunchPolicyEvidence.ps1'
      - '.github/workflows/chrome-interactive-launch-policy-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.repo.owner.login == github.repository_owner) }}
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, got $actual."
          }

      - name: Validate adapter syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\Add-NotifierChromeInteractiveLaunchPolicyEvidence.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Interactive Chrome launch/policy adapter has PowerShell parse errors.'
          }

      - name: Collect bounded helper evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chrome-interactive-launch-policy-evidence.json'
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:SOURCE_SHA
            readOnly = $true
            chrome = [ordered]@{}
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $output -Encoding UTF8

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Add-NotifierChromeInteractiveLaunchPolicyEvidence.ps1 -EvidencePath $output
          if ($LASTEXITCODE -ne 0) { throw "Interactive launch/policy adapter failed with exit code $LASTEXITCODE." }

          $evidence = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $raw = Get-Content -LiteralPath $output -Raw -Encoding UTF8
          if ($evidence.schemaVersion -ne 1 -or $evidence.readOnly -ne $true) {
            throw 'Interactive launch/policy evidence schema/read-only marker is invalid.'
          }
          foreach ($forbidden in @('"commandLine":','"executablePath":','"profileImagePath":','HKEY_USERS\\S-1-','C:\\Users\\dan')) {
            if ($raw -match [regex]::Escape($forbidden)) {
              throw "Interactive launch/policy evidence leaked forbidden detail: $forbidden"
            }
          }

          $item = $evidence.chrome.interactiveLaunchPolicy
          Write-Host ("Interactive Chrome evidence: state={0}; processState={1}; browserProcesses={2}; readable={3}; disableExtensions={4}; disableExtensionsExcept={5}; userDataDirOverride={6}; userPolicy={7}; userPolicyKey={8}" -f `
            $item.state,
            $item.chromeProcesses.state,
            $item.chromeProcesses.browserProcessCount,
            $item.chromeProcesses.browserCommandLinesReadable,
            $item.chromeProcesses.anyBrowserDisableExtensions,
            $item.chromeProcesses.anyBrowserDisableExtensionsExcept,
            $item.chromeProcesses.anyBrowserUserDataDirOverride,
            $item.currentUserPolicy.state,
            $item.currentUserPolicy.chromePolicyKeyPresent)

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: chrome-interactive-launch-policy-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\chrome-interactive-launch-policy-evidence.json
          if-no-files-found: error
          retention-days: 7
