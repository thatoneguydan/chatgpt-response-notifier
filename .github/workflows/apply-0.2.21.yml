name: Apply public notifier 0.2.21 source

on:
  push:
    branches:
      - fix/terminal-user-facing-0.2.21
    paths:
      - '.github/workflows/apply-0.2.21.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/terminal-user-facing-0.2.21

      - name: Apply and verify terminal-state runtime
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-0.2.21-terminal.py
          node --check extension/service-worker.js
          node --check extension/lib/server-capture.js
          test "$(git hash-object extension/lib/server-capture.js)" = "1191d00f7211907a9755f436f36efb51e81a4b66"
          test "$(git hash-object extension/manifest.json)" = "9c27a848f6865caff48940bc3f4731e8bb79b3b9"
          test "$(git hash-object VERSION.txt)" = "599028f5f5f70e3098a6728e1aff2c40c4c86e9f"
          grep -q "network-completed-terminal-toast" extension/service-worker.js
          grep -q "network-completed-waiting-for-terminal" extension/service-worker.js
          grep -q "network-completed-rearming-terminal-watch" extension/service-worker.js
          grep -q "existingWatch && !existingWatch.cancelled" extension/service-worker.js
          grep -q "Network completion is therefore only an acceleration signal" extension/service-worker.js
          if grep -q "SERVER_CAPTURE_GENERIC_PREVIEW" extension/service-worker.js; then
            echo 'Premature generic-completion fallback still present.' >&2
            exit 1
          fi

      - name: Commit public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply-0.2.21-terminal.py .github/workflows/apply-0.2.21.yml
          git add extension/service-worker.js
          git commit -m 'Wait for terminal ChatGPT answers before notifying'
          git push origin HEAD:fix/terminal-user-facing-0.2.21
