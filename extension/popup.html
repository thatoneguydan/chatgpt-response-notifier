<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Response Notifier</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; background: #171717; color: #f2f2f2; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { color: #cfcfcf; line-height: 1.4; margin: 0 0 12px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 9px 10px; font-weight: 650; cursor: pointer; }
    button + button { margin-top: 8px; }
    #status, #updateStatus { margin-top: 9px; color: #bdbdbd; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>ChatGPT Response Notifier</h1>
  <p>Uses the upstream prompt-bound completion monitor and the Windows helper for persistent stacked notifications.</p>
  <button id="test">Test persistent notification</button>
  <button id="checkUpdate">Check for update</button>
  <div id="status">Checking Windows helper...</div>
  <div id="updateStatus"></div>
  <script src="popup.js"></script>
</body>
</html>
