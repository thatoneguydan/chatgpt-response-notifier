<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Response Notifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 410px;
      max-height: 620px;
      margin: 0;
      background: #171717;
      color: #f2f2f2;
      font: 12.5px system-ui, sans-serif;
    }
    #monitorBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 9px;
      border-bottom: 1px solid #303030;
      background: #1b1b1b;
    }
    #monitorState { min-width: 0; flex: 1; color: #a9a9a9; line-height: 1.25; }
    #monitorState strong { display: block; color: #e7e7e7; font-size: 11.5px; }
    #monitorDetail { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; }
    #monitorControls { display: flex; gap: 5px; align-items: center; }
    #attentionSection { border-bottom: 1px solid #303030; }
    #attentionSection[hidden], #resumeRecovery[hidden] { display: none; }
    .section-title { padding: 7px 9px 3px; color: #d8a85c; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .attention-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      padding: 8px 9px;
      border-top: 1px solid #272727;
    }
    .attention-copy { min-width: 0; cursor: pointer; }
    .attention-title { display: block; color: #f3f3f3; font-weight: 650; overflow-wrap: anywhere; }
    .attention-reason { display: block; margin-top: 3px; color: #d8a85c; font: 600 10px Consolas, monospace; }
    .attention-preview { display: block; margin-top: 3px; color: #bdbdbd; line-height: 1.3; }
    #history {
      max-height: 430px;
      overflow-y: auto;
      padding: 6px;
    }
    .history-item {
      display: block;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-bottom: 1px solid #2d2d2d;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .history-item:hover, .attention-copy:hover { background: #242424; }
    .history-title { display: block; color: #f5f5f5; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; white-space: normal; }
    .history-status { display: block; margin-top: 4px; color: #9b9b9b; font: 600 10.5px Consolas, monospace; overflow-wrap: anywhere; }
    .history-preview { display: -webkit-box; margin-top: 4px; overflow: hidden; color: #bdbdbd; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .history-time { display: block; margin-top: 4px; color: #777; font-size: 10.5px; }
    #empty { padding: 24px 12px; color: #777; text-align: center; }
    footer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 7px 9px;
      border-top: 1px solid #303030;
      background: #171717;
    }
    #version { color: #777; font-size: 10.5px; }
    .controls { display: flex; gap: 5px; }
    .mini {
      min-width: 52px;
      height: 27px;
      padding: 0 8px;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      background: #252525;
      color: #d7d7d7;
      font: 600 10.5px system-ui, sans-serif;
      cursor: pointer;
    }
    .mini:hover { background: #303030; }
    .mini:disabled { cursor: default; opacity: .55; }
    .mini.enabled { border-color: #5b765b; color: #cfe4cf; }
    .mini.warning { border-color: #7d643d; color: #e2c28e; }
    .dismiss { min-width: 28px; width: 28px; padding: 0; }
  </style>
</head>
<body>
  <section id="monitorBar" aria-label="Build monitoring">
    <div id="monitorState">
      <strong>Build monitoring</strong>
      <span id="monitorDetail">Open a ChatGPT conversation</span>
    </div>
    <div id="monitorControls">
      <button class="mini" id="monitorToggle" disabled>Monitor</button>
      <button class="mini" id="recoveryToggle" disabled title="Allow bounded background recovery for this conversation">Recover</button>
      <button class="mini warning" id="resumeRecovery" hidden title="Reset the run fuse and resume bounded recovery after an explicit stop">Resume</button>
    </div>
  </section>
  <section id="attentionSection" aria-label="Recovery attention" hidden>
    <div class="section-title">Needs attention</div>
    <div id="attention"></div>
  </section>
  <main id="history" aria-label="Recent coded notifications">
    <div id="empty">No recent coded notifications</div>
  </main>
  <footer>
    <span id="version"></span>
    <div class="controls">
      <button class="mini" id="checkUpdate" title="Check for and install updates">Update</button>
      <button class="mini" id="test" title="Show a test notification">Test</button>
    </div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
