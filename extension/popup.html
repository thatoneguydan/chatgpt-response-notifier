<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Response Notifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      max-height: 560px;
      margin: 0;
      background: #171717;
      color: #f2f2f2;
      font: 12.5px system-ui, sans-serif;
    }
    #history {
      max-height: 510px;
      overflow-y: auto;
      padding: 6px;
    }
    .history-item {
      display: block;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-bottom: 1px solid #2d2d2d;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .history-item:hover { background: #242424; }
    .history-title {
      display: block;
      color: #f5f5f5;
      font-weight: 650;
      line-height: 1.25;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .history-status {
      display: block;
      margin-top: 4px;
      color: #9b9b9b;
      font: 600 10.5px Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .history-preview {
      display: -webkit-box;
      margin-top: 4px;
      overflow: hidden;
      color: #bdbdbd;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .history-time {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 10.5px;
    }
    #empty {
      padding: 24px 12px;
      color: #777;
      text-align: center;
    }
    footer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 7px 9px;
      border-top: 1px solid #303030;
      background: #171717;
    }
    #version { color: #777; font-size: 10.5px; }
    .controls { display: flex; gap: 5px; }
    .mini {
      min-width: 52px;
      height: 27px;
      padding: 0 8px;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      background: #252525;
      color: #d7d7d7;
      font: 600 10.5px system-ui, sans-serif;
      cursor: pointer;
    }
    .mini:hover { background: #303030; }
    .mini:disabled { cursor: default; opacity: .55; }
  </style>
</head>
<body>
  <main id="history" aria-label="Recent notifications">
    <div id="empty">No recent notifications</div>
  </main>
  <footer>
    <span id="version"></span>
    <div class="controls">
      <button class="mini" id="checkUpdate" title="Check for and install updates">Update</button>
      <button class="mini" id="test" title="Show a test notification">Test</button>
    </div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
